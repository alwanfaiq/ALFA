<script>
const C=window.ALFA_CFG||{},I=window.ALFA_I18N,Q=new URLSearchParams(location.search),T=["places","events"].includes(Q.get("t"))?Q.get("t"):"characters",ID=Q.get("id")||"",app=document.getElementById("app");
const el=(a,c,x)=>{const e=document.createElement(a);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const OK=u=>{if(!/^(assets\/|\/assets\/|https:\/\/)/.test(u||""))return"";return u.startsWith("assets/")?"/"+u:u};
const bkBtn = document.getElementById("back");
const bkSec = (T=="places"?"places":T=="events"?"chronology":"characters");
bkBtn.href = "/#" + bkSec;
bkBtn.onclick = (e) => {
  if(window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)){
    e.preventDefault();
    window.history.back();
  }
};

let RAW_REC=null;
function showToast(msg){
  const tb=document.getElementById("toastBox");
  if(!tb)return;
  tb.textContent=msg;tb.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{tb.classList.remove("show")},2800);
}

function syncHeaderUI(){
  const cur=I.getLang();
  const lb=document.getElementById("langBtnText");
  if(lb)lb.textContent=cur.toUpperCase();
  document.querySelectorAll(".lang-drop-item").forEach(it=>{
    it.classList.toggle("on",it.getAttribute("data-lang")===cur);
  });
  const bk=document.getElementById("back");
  if(bk)bk.textContent=I.t("back");
  const lm=document.getElementById("loadMsg");
  if(lm)lm.textContent=I.t("loading");
  const st=document.getElementById("shareTxt");
  if(st)st.textContent=I.t("shareStory")||"Bagi Kisah";
}

// Reading progress listener
window.addEventListener("scroll",()=>{
  const max=document.documentElement.scrollHeight-window.innerHeight;
  const pct=max>0?(window.scrollY/max)*100:0;
  const bar=document.getElementById("readProgress");
  if(bar)bar.style.width=Math.min(100,Math.max(0,pct))+"%";
},{passive:true});

// Share button click
document.getElementById("shareBtn").onclick=()=>{
  const shareData={title:document.title,url:location.href};
  if(navigator.share){
    navigator.share(shareData).catch(()=>{});
  }else{
    navigator.clipboard.writeText(location.href).then(()=>{
      showToast(I.t("linkCopied")||"Tautan berhasil disalin!");
    }).catch(()=>{
      showToast(I.t("linkCopied")||"Tautan berhasil disalin!");
    });
  }
};

async function get(){
  const D=await (await fetch("/defaults.json")).json();

(function initLangDropdown(){
  const wrap=document.getElementById("langDropdownWrap");
  const trig=document.getElementById("langDropTrigger");
  const menu=document.getElementById("langDropMenu");
  if(!trig||!menu)return;
  const close=()=>{menu.classList.remove("open");menu.setAttribute("hidden","");trig.setAttribute("aria-expanded","false")};
  trig.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    const isOpen=menu.classList.contains("open");
    if(isOpen)close();
    else{menu.removeAttribute("hidden");menu.classList.add("open");trig.setAttribute("aria-expanded","true")}
  };
  document.addEventListener("click",e=>{if(wrap&&!wrap.contains(e.target))close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  document.querySelectorAll(".lang-drop-item").forEach(item=>{
    item.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const l=item.getAttribute("data-lang");
      if(l&&I&&typeof I.setLang==="function")I.setLang(l);
      close();
    };
  });
