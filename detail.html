<style>
*{box-sizing:border-box;margin:0}

@media(max-width:600px){.rich figure.fr,.rich figure.fl{float:none;width:100%;margin:1em 0}}

.rc:hover{transform:translateY(-6px);box-shadow:0 0 0 2px var(--gold),0 12px 32px rgba(196,163,90,.35)}

.rc.ev{aspect-ratio:auto;padding:14px 16px;background:#2a2012;border:1px solid var(--gold);display:grid;gap:6px;align-content:start;min-height:140px}.rc.ev small{color:var(--gold2)}.rc.ev b{font:700 1rem/1.3 Arvo,serif}.rc.ev span{font-size:.85rem;color:#d9cdb2;line-height:1.4}

<header><a class="logo" href="index.html">ALFA<small>History<br>of Islam</small></a><a class="back" id="back" href="index.html">← Kembali</a></header>
<div id="app"><p class="msg">Memuat...</p></div>
<script src="config.js"></script>

<script>
const C=window.ALFA_CFG||{},Q=new URLSearchParams(location.search),T=["places","events"].includes(Q.get("t"))?Q.get("t"):"characters",ID=Q.get("id")||"",app=document.getElementById("app");
const el=(a,c,x)=>{const e=document.createElement(a);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const OK=u=>/^(assets\/|https:\/\/)/.test(u||"")?u:"";
document.getElementById("back").href="index.html#"+(T=="places"?"places":T=="events"?"chronology":"characters");
async function get(){
 if(/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(ID)&&C.url&&!C.url.includes("YOUR-")){const r=await fetch(C.url+"/rest/v1/"+T+"?id=eq."+ID+"&select=*",{headers:{apikey:C.key}});if(r.ok)return (await r.json())[0]}
 const D=await (await fetch("defaults.json")).json();
 return T=="places"?D.places.find(p=>p.slug==ID):T=="events"?D.events.find(p=>p.slug==ID):D.characters[+ID.replace(/\D/g,"")]}
function body(t){const b=el("div","bd");(t||"").split("\n").forEach(l=>{if(!l.trim())return;if(l.startsWith("# "))b.append(el("h4","",l.slice(2)));else if(l.startsWith("- "))b.append(el("h5","",l.slice(2)));else b.append(el("p","",l.trim()))});return b}
const OKT={P:1,BR:1,H2:1,H3:1,H4:1,STRONG:1,B:1,EM:1,I:1,U:1,S:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,A:1,IMG:1,FIGURE:1,FIGCAPTION:1,HR:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1};
function san(h){const d=new DOMParser().parseFromString("<body>"+h,"text/html").body,out=document.createElement("div");
(function walk(src,dst){src.childNodes.forEach(n=>{if(n.nodeType==3){dst.append(document.createTextNode(n.textContent));return}if(n.nodeType!=1)return;let t=n.tagName;
if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|FORM|INPUT|BUTTON|TEXTAREA|SELECT|SVG|MATH|NOSCRIPT|TEMPLATE)$/.test(t))return;
if(t=="DIV")t="P";if(t=="STRIKE"||t=="DEL")t="S";if(!OKT[t]){walk(n,dst);return}
const e=document.createElement(t.toLowerCase());
if(t=="A"){const h=n.getAttribute("href")||"";if(/^(https:\/\/|detail\.html\?|index\.html|#)/.test(h)){e.setAttribute("href",h);if(/^https:\/\//.test(h)){e.target="_blank";e.rel="noopener"}}}
if(t=="IMG"){const s=n.getAttribute("src")||"";if(!/^(https:\/\/|assets\/)/.test(s))return;e.setAttribute("src",s);e.alt=(n.getAttribute("alt")||"").slice(0,200)}
if(t=="FIGURE"){const c=(n.getAttribute("class")||"").split(/\s+/).filter(x=>x=="fr"||x=="fl"||x=="fc");if(c.length)e.className=c[0]}
if(t=="TD"||t=="TH"){const cs=+n.getAttribute("colspan");if(cs>1&&cs<10)e.setAttribute("colspan",cs)}
walk(n,e);dst.append(e)})})(d,out);return out}
function edgeColor(im){try{const w=40,h=Math.max(8,Math.round(40*im.naturalHeight/im.naturalWidth)),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);const p=x.getImageData(0,0,w,h).data;const R=[],G=[],B=[];for(let i=0;i<w;i++)for(let j=0;j<h;j++){if(i>1&&i<w-2&&j>1&&j<h-2)continue;const k=(j*w+i)*4;R.push(p[k]);G.push(p[k+1]);B.push(p[k+2])}const md=a=>a.sort((x,y)=>x-y)[a.length>>1];return"rgb("+md(R)+","+md(G)+","+md(B)+")"}catch(e){return null}}
const isH=s=>/^\s*<[a-z]/i.test(s||"");
function article(t){if(!isH(t)){return body(t)}const b=el("div","bd rich");b.append(...san(t).childNodes);return b}
function toc(b){const hs=[...b.querySelectorAll("h2,h3,h4")];if(hs.length<3)return;const n=el("nav","toc");n.append(el("b","","Daftar isi"));hs.forEach((h,i)=>{h.id="b"+i;const a=el("a",h.tagName=="H3"?"s":"",h.textContent);a.href="#b"+i;n.append(a)});b.prepend(n)}
const cn=c=>{try{return new Intl.DisplayNames(["id"],{type:"region"}).of(c)||c}catch(e){return c}};
const yl=d=>d.year+(d.year_end&&d.year_end!=d.year?"–"+d.year_end:"")+" M";
function ev2(d){const cs=(Array.isArray(d.countries)?d.countries:[]).map(cn).join(", ");return {...d,name:d.title,meta:d.meta||yl(d),body:d.body||d.summary,facts:d.facts||("Tahun : "+yl(d)+(cs?"\nWilayah : "+cs:""))}}
async function related(d,m){let list=[];const cfg=C.url&&!C.url.includes("YOUR-"),
cols={places:["id,slug,name,subtitle,x,y,map,slides","id,slug,name,subtitle"],events:["id,slug,title,year,year_end,summary,countries"],characters:["id,name,role,img,eras,groups,faith","id,name,role,img"]}[T];
if(cfg)for(const c of cols){try{const r=await fetch(C.url+"/rest/v1/"+T+"?select="+c+"&order="+(T=="events"?"year.asc":"t.asc"),{headers:{apikey:C.key}});if(r.ok){list=await r.json();if(list.length)break}}catch(e){}}
if(!list.length){try{const D=await (await fetch("defaults.json")).json();list=T=="places"?D.places.map(x=>({...x,id:x.slug})):T=="events"?D.events.map(x=>({...x,id:x.slug})):D.characters.map((x,i)=>({...x,id:"d"+i}))}catch(e){return}}
const ar=x=>Array.isArray(x)?x:[],sh=(a,b)=>ar(a).filter(z=>ar(b).includes(z)).length;
list=list.filter(x=>String(x.id)!=String(ID)&&x.slug!=ID&&(x.name||x.title)!=d.name);
list.forEach(x=>{x._s=T=="places"?((x.map&&d.map&&x.map==d.map?5:0)-(Math.hypot((+x.x||0)-(+d.x||0),(+x.y||0)-(+d.y||0))/20)):T=="events"?(sh(x.countries,d.countries)*2-Math.abs((+x.year||0)-(+d.year||0))/40+Math.random()*.3):sh(x.groups,d.groups)*3+sh(x.eras,d.eras)+(x.faith&&x.faith==d.faith?1:0)+Math.random()*.5});
list=list.sort((a,b)=>b._s-a._s).slice(0,T=="characters"?6:4);if(!list.length)return;
const s=el("section","rel"),g=el("div","rg");s.append(el("h2","",({places:"Tempat lainnya",events:"Peristiwa lainnya",characters:"Tokoh lainnya"})[T]),g);
list.forEach(x=>{const a=el("a","rc"+(T=="places"?" pl":T=="events"?" ev":""));const uuid=/^[0-9a-f]{8}-/i.test(String(x.id));a.href="detail.html?t="+T+"&id="+encodeURIComponent((T!="characters"&&x.slug&&!uuid)?x.slug:x.id);
if(T=="events"){a.append(el("small","",yl(x)),el("b","",x.title),el("span","",(x.summary||"").slice(0,90)+((x.summary||"").length>90?"…":"")));g.append(a);return}
const u=OK(T=="places"?ar(x.slides)[0]:x.img);if(u){const im=new Image();im.src=u;im.alt=x.name;im.loading="lazy";a.append(im)}else a.classList.add("ph");
const lb=el("span","lb"),sm=T=="places"?x.subtitle:x.role;if(sm)lb.append(el("small","",sm));lb.append(el("b","",x.name));a.append(lb);g.append(a)});m.append(s)}
function fail(m){app.replaceChildren(el("p","msg",m))}
function render(d){
 if(!d)return fail("Halaman tidak ditemukan.");if(T=="events")d=ev2(d);
 document.title=d.name+" | ALFA";if(!render.t){render.t=1;alfaTrack({page:T,pid:ID,title:d.name})}app.replaceChildren();
 const sl=(Array.isArray(d.slides)?d.slides:[]).map(OK).filter(Boolean);
 if(sl.length){const h=el("div"),w=el("div","sl"),im=new Image(),l=el("button","ar l"),r=el("button","ar r"),dt=el("div","dots");h.id="hero";im.crossOrigin="anonymous";im.onload=()=>{const c=edgeColor(im);h.style.background=c||""};im.onerror=()=>{if(im.crossOrigin){im.removeAttribute("crossorigin");im.crossOrigin=null;im.src=sl[i]}};im.alt=d.name;l.setAttribute("aria-label","Sebelumnya");r.setAttribute("aria-label","Berikutnya");
  let i=0;const go=n=>{i=(n+sl.length)%sl.length;im.src=sl[i];dt.childNodes.forEach((x,k)=>x.classList.toggle("on",k==i))};
  sl.forEach((_,k)=>{const x=el("i");x.onclick=()=>go(k);dt.append(x)});l.onclick=()=>go(i-1);r.onclick=()=>go(i+1);
  if(sl.length<2){l.hidden=r.hidden=true;dt.hidden=true}
  document.onkeydown=e=>{if(e.key=="ArrowLeft")go(i-1);if(e.key=="ArrowRight")go(i+1)};
  w.append(im,l,r);h.append(w,dt);app.append(h);go(0)}
 const m=el("main");m.append(el("h1","",d.name));
 if(d.meta||d.subtitle)m.append(el("p","meta",d.meta||d.subtitle));
 const cols=el("div","cols"),left=el("div"),right=el("div");
 const art=article(d.body||d.description||d.bio);toc(art);left.append(art);
 const fl=(d.facts||"").split("\n").filter(l=>l.trim()&&(!l.includes(":")||l.slice(l.indexOf(":")+1).trim()));
 if(fl.length){const bx=el("div","box");bx.append(el("b","","Detail"));bx.append(document.createTextNode(fl.join("\n")));left.append(bx)}
 (Array.isArray(d.gallery)?d.gallery:[]).forEach(g=>{if(!OK(g.url))return;const f=el("figure"),im=new Image();im.src=g.url;im.alt=g.caption||"";f.append(im);if(g.caption)f.append(el("figcaption","",g.caption));right.append(f)});
 cols.append(left);if(right.children.length)cols.append(right);else cols.style.gridTemplateColumns="minmax(0,820px)";
 m.append(cols);app.append(m);if(!/[?&]preview=1/.test(location.search))related(d,m)}
if(/[?&]preview=1/.test(location.search)){app.replaceChildren(el("p","msg","Pratinjau: isi formulir di admin, halaman ini akan ikut berubah."));
addEventListener("message",e=>{if(e.origin===location.origin&&e.data&&e.data.type=="alfa-draft"&&e.data.data)render(e.data.data)})}
else get().then(render).catch(()=>fail("Gagal memuat data."));
</script></body></html>
