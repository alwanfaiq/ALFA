<!-- ALFA | History of Islam: admin.html v1.4.0 --><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin | ALFA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#181818">

<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#181818;--p:#212121;--g:#c4a35a;--g2:#6e5c36;--ink:#f3ead8;--mut:#b4a88f;--dim:#8c826e;--line:#352d1f;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.6 Bitter,Georgia,serif;width:100%;max-width:none !important;margin:0;padding:0}
h1,h3{font-family:Cinzel,serif;font-weight:800}h1{font-size:1.45rem;letter-spacing:.05em}h3{color:var(--g);font-size:1.05rem;letter-spacing:.04em}
button,.go{font:600 .83rem/1 Bitter,Georgia,serif;background:none;border:1px solid var(--g2);color:var(--ink);height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .15s}
button:hover,.go:hover{border-color:var(--g);background:rgba(196,163,90,.16);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--g);border-color:var(--g);color:#14110b;font-family:Cinzel,serif;font-weight:800;letter-spacing:.04em}
button.pri:hover{background:#d9bc76;border-color:#d9bc76;color:#100d08}
button.sec{background:#1d1912;border-color:#4b3e24;color:#dfd3bc;font-size:.8rem;height:35px;padding:0 12px}
button.sec:hover{border-color:var(--g);color:var(--g);background:#251f15}
button.danger-sm{border-color:#5a3232;color:#e09b9b}
button.danger-sm:hover{background:#7a2828;border-color:#a33a3a;color:#fff}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.adm-hdr{position:sticky;top:0;z-index:900;width:100%;background:#14120e;border-bottom:1px solid #352c1d;padding:12px clamp(16px,2.2vw,32px);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.adm-brand{display:flex;align-items:center;gap:12px}
.adm-brand span{font-size:.78rem;color:var(--mut);border-left:1px solid #3a3122;padding-left:12px}
.adm-hdr-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adm-subbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid #2e271b}
.adm-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:35px;padding:0 14px;font:700 .78rem/1 Cinzel,serif;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);border-color:#3a3122;background:#1c1914}
.tabs button:hover{color:#fff;border-color:var(--g)}
.tabs .on{background:var(--g) !important;border-color:var(--g) !important;color:#14110b !important}

/* Strict 12-Column Aligned Form Layout */
.fm{display:grid;gap:18px;width:100%;max-width:none;background:var(--p);border:1px solid var(--g2);padding:22px 24px;margin:0 0 24px}
.fm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #322a1d}
.fm-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px 20px;align-items:start}
.c-2{grid-column:span 2}.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-8{grid-column:span 8}.c-12,.span-all{grid-column:1 / -1}
body:not(.pv-hidden) .fm-grid .c-3{grid-column:span 3}
body:not(.pv-hidden) .fm-grid .c-4{grid-column:span 4}

}
@media(max-width:980px){
  .fm-grid .c-2,.fm-grid .c-3,.fm-grid .c-4{grid-column:span 6}
  .fm-grid .c-6,.fm-grid .c-8{grid-column:1 / -1}

@media(max-width:640px){
  .fm{padding:16px}
  .fm-grid{gap:14px 12px}
  .fm-grid .c-2,.fm-grid .c-3,.fm-grid .c-4,.fm-grid .c-6,.fm-grid .c-8{grid-column:1 / -1}
}
.fm-acts{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid #322a1d;flex-wrap:wrap}

/* Unified Field Controls & Laser-Aligned Baselines */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld-lbl{font:700 .8rem/1.25 Bitter,Georgia,serif;color:#d8ccb4;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld-hint{font-size:.73rem;line-height:1.38;color:var(--dim)}
label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--mut);min-width:0}
label.ck{display:inline-flex;flex-direction:row;gap:8px;align-items:center;cursor:pointer}
input,textarea,select{background:#14120e;color:var(--ink);border:1px solid #4d4027;font:400 .9rem/1.45 Bitter,Georgia,serif;width:100%;transition:border-color .15s,background .15s}
:where(input:not([type=checkbox]):not([type=range]):not([type=file]),select){height:40px;padding:0 12px}
input[type=file]{height:40px;padding:5px 10px;font-size:.82rem;border-style:dashed;border-color:#5b4b2e;cursor:pointer;line-height:28px}
input[type=file]::file-selector-button{background:#231d13;color:var(--g);border:1px solid var(--g2);padding:4px 11px;margin-right:10px;font:700 .74rem/1 Bitter,Georgia,serif;cursor:pointer;transition:all .15s}
input[type=file]::file-selector-button:hover{background:var(--g);color:#14110b;border-color:var(--g)}
input:focus,textarea:focus,select:focus{border-color:var(--g);background:#181510;outline:none}
input[type=checkbox]{width:auto;accent-color:var(--g)}
textarea{padding:9px 12px;min-height:84px;resize:vertical}

textarea.facts-area{min-height:112px;font-family:Bitter,Georgia,serif;line-height:1.55}
textarea.big{min-height:180px}
.hlp{font-size:.76rem;color:var(--dim);white-space:pre-line}
.pv{width:52px;height:68px;object-fit:cover;object-position:50% 13%;border:1px solid var(--g2);flex-shrink:0}.pv[hidden]{display:none}
.pvc{width:46px;height:108px}
.file-row{display:flex;align-items:flex-start;gap:10px}
.file-row input[type=file]{flex:1;min-width:0}
.media-box{display:grid;gap:8px}
.media-box .ls-stack:empty{display:none}

/* Searchable Multi-Column Content Browser (.ls-sec + .ls) */
.ls-sec{display:grid;gap:12px;width:100%;margin-top:6px}
.ls-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--p);border:1px solid var(--g2);padding:12px 16px}
.ls-bar h3{margin:0;font-size:1rem}
.ls-search-wrap{position:relative;flex:1;min-width:240px;max-width:460px;display:flex;align-items:center}
.ls-search-wrap svg{position:absolute;left:11px;color:var(--g);pointer-events:none}
.ls-search-wrap input{padding-left:34px;padding-right:30px;height:36px;background:#14120e;border:1px solid var(--g2);font-size:.88rem}
.ls-search-wrap input:focus{border-color:var(--g);outline:none}
.ls-clr{position:absolute;right:6px;width:24px;height:24px;padding:0;border:0;background:none;color:var(--mut);font-size:1rem;cursor:pointer}
.ls-clr:hover{background:none;color:#fff}
.ls-cnt{font-size:.8rem;color:var(--mut);white-space:nowrap}
.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;width:100%;max-width:none}
.ls-stack{display:grid;gap:8px;width:100%}
.row,.it{display:flex;align-items:center;gap:11px;background:var(--p);padding:9px 12px;border:1px solid #30291e;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--g2);background:#252119}
.row.editing{border-color:var(--g);background:#292317}
.row .pv{width:46px;height:46px;object-fit:cover;object-position:50% 13%}
.row .ph{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;background:#191610;border:1px solid #383022;font:700 .78rem Cinzel,serif;color:var(--g)}
.row .r-info{flex:1;min-width:0;display:grid;gap:2px}
.row .r-title{font:700 .9rem/1.3 Bitter,serif;color:#faf6ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub{font-size:.76rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-acts{display:flex;gap:6px;flex-shrink:0}
.it{background:#14120e;padding:7px 9px}.it input{flex:1;height:34px;font-size:.84rem}.it .pv{width:58px;height:40px}
.row button,.sm{height:30px;padding:0 10px;font-size:.76rem}
.adm-quick-search{position:relative;min-width:220px;max-width:300px}
.adm-quick-search input{height:35px;padding:0 10px 0 32px;font-size:.82rem;background:#16130d;border:1px solid #4b3e24}
.adm-quick-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--g);pointer-events:none}
.adm-quick-drop{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#18140e;border:1px solid var(--g);box-shadow:0 12px 32px rgba(0,0,0,.85);z-index:950;max-height:300px;overflow-y:auto;display:grid}
.adm-quick-drop[hidden]{display:none}
.adm-quick-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border:0;border-bottom:1px solid #2b2418;background:none;color:var(--ink);text-align:left;height:auto;font-size:.8rem}
.adm-quick-item:hover{background:#282115;color:#fff}
.adm-quick-item small{color:var(--g);font:700 .66rem Cinzel,serif;text-transform:uppercase;flex-shrink:0}

/* Interactive Zoomable Leaflet Map Picker & Full Map Editor */
.adm-map-shell{display:grid;gap:0;border:1px solid var(--g2);background:#14120e;width:100%}
.adm-map-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#1b1710;border-bottom:1px solid #3a3122}
.adm-map-grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adm-map-bar button{height:31px;padding:0 10px;font:700 .74rem/1 Cinzel,serif;letter-spacing:.04em;text-transform:uppercase;border-color:#4b3e24;background:#14110b;color:#dfd3bc}
.adm-map-bar button:hover{border-color:var(--g);color:var(--g);background:#251f15}
.adm-map-bar button.ico-z{width:31px;padding:0;font:700 1rem/1 Bitter,serif}
.adm-map-coords{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label.adm-coord-fld{display:inline-flex;flex-direction:row;align-items:center;gap:6px;background:#14110b;border:1px solid #443824;padding:0 8px;height:31px;font-size:.74rem;color:var(--g);font-weight:700;white-space:nowrap}

label.adm-coord-fld input:focus{background:#1f1a12;outline:none}
.adm-map-stage{position:relative;isolation:isolate;z-index:1;width:100%;height:460px;background:#5e7472;overflow:hidden}
.adm-map-canvas{width:100%;height:100%;background:#5e7472;cursor:crosshair}
.adm-map-canvas.leaflet-container{font-family:Bitter,Georgia,serif;background:#5e7472}
.adm-map-hud-z{position:absolute;top:10px;right:10px;z-index:420;pointer-events:none;background:rgba(16,13,9,.88);border:1px solid var(--g2);color:var(--g);padding:4px 10px;font:700 .72rem/1.2 Cinzel,serif;letter-spacing:.05em}
.adm-map-hud-xy{position:absolute;bottom:10px;left:10px;z-index:420;pointer-events:none;background:rgba(16,13,9,.86);border:1px solid #463a24;color:#e6dcc8;padding:4px 10px;font:600 .74rem/1.2 monospace}
.adm-pin-icon{background:transparent;border:0}
.adm-pin-active{width:18px;height:18px;background:var(--g);border:2px solid #14110b;transform:rotate(45deg);box-shadow:0 0 0 3px rgba(196,163,90,.42),0 3px 10px rgba(0,0,0,.7);transition:transform .12s}
.adm-pin-active.sel-crimson{background:#fff;border-color:#14110b;box-shadow:0 0 0 3px #e04040,0 3px 12px rgba(0,0,0,.85)}
.adm-pin-ref{width:10px;height:10px;background:rgba(196,163,90,.78);border:1.5px solid #18140e;transform:rotate(45deg);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.adm-pin-ref:hover{background:#fff;border-color:var(--g)}
.leaflet-tooltip.adm-pin-tip{background:#16130d;color:#faf6ee;border:1px solid var(--g);border-radius:0;padding:3px 8px;font:700 .74rem/1.2 Bitter,serif;box-shadow:0 4px 14px rgba(0,0,0,.75)}
.leaflet-tooltip.adm-pin-tip::before{border-top-color:var(--g)}

.m{color:var(--mut);max-width:56ch;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:1200;display:grid;place-items:center;padding:16px;overflow:auto}
.cb{background:var(--p);border:1px solid var(--g);padding:20px;display:grid;gap:12px;justify-items:center;max-width:100%}
.fr{position:relative;overflow:hidden;border:2px solid var(--g);background:#000;touch-action:none;cursor:grab}.fr img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fr.lbl::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(to bottom,rgba(24,24,24,0),rgba(24,24,24,.9));pointer-events:none}
#tw{position:fixed;right:16px;bottom:16px;z-index:1400;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;background:#232323;border:1px solid var(--g2);border-left:5px solid var(--g);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:.93rem;line-height:1.45}
.toast.err{border-left-color:#d9534f}.toast.warn{border-left-color:#e0a030}.toast button{border:0;padding:0 4px;font-size:1.2rem;line-height:1;color:var(--mut)}.toast button:hover{background:none;color:var(--ink)}
.wrap{width:100%;max-width:none;padding:18px clamp(16px,2.2vw,32px) 56px;display:grid;grid-template-columns:minmax(520px,1.08fr) minmax(420px,.92fr);gap:24px;align-items:start}
body.pv-hidden .wrap{grid-template-columns:minmax(0,1fr) !important}
body.pv-hidden .pane{display:none}
.pane{position:sticky;top:74px}
.pvh{display:flex;gap:8px;align-items:center;min-height:35px;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid #2e271b}.pvh b{flex:1;font:800 .88rem/1 Cinzel,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.pvh button{height:35px;padding:0 13px;font:700 .76rem/1 Cinzel,serif;text-transform:uppercase;letter-spacing:.04em}
.pvh .on{background:var(--g) !important;border-color:var(--g) !important;color:#14110b !important}
.pvbox{position:relative;overflow:hidden;border:1px solid var(--g2);background:#000;height:calc(100vh - 145px)}
.pvbox iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#181818}
.fm,.ls{max-width:none}
@media(max-width:1180px){.wrap{grid-template-columns:1fr}.pane{display:none}}

/* Full-Screen Map Editor Modal */
.mb{width:min(1440px,96vw);grid-template-columns:minmax(0,1fr) 310px;align-items:stretch;justify-items:stretch;gap:14px;padding:18px}
.mb-top{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid #352d1f}
.mb-stage{height:min(72vh,650px)}
.mr{display:flex;flex-direction:column;gap:10px;min-height:0;max-height:min(72vh,650px)}
.mr-info{background:#15120d;border:1px solid #3a3122;padding:10px 12px;font-size:.8rem;line-height:1.45;color:var(--ink);display:grid;gap:8px}
.mr-info .mr-sub{font-size:.74rem;color:var(--mut)}
.mr-search{height:34px;font-size:.82rem;padding:0 10px}
.mr-list{flex:1;overflow-y:auto;display:grid;gap:4px;align-content:start;padding-right:2px}
.mr-list .mr-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:auto;min-height:34px;padding:6px 10px;background:#191610;border:1px solid #2f281c;color:var(--ink);text-align:left;font:600 .8rem/1.3 Bitter,serif}
.mr-list .mr-item:hover{border-color:var(--g2);background:#241f16}
.mr-list .mr-item.on{background:var(--g);border-color:var(--g);color:#14110b}
.mr-list .mr-item .mr-dot{font:700 .7rem monospace;opacity:.85}
@media(max-width:960px){.mb{grid-template-columns:1fr}.mb-stage{height:52vh}.mr{max-height:36vh}}
.rf{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Icon-only Controls & Word-Style Document Editor */
.ico-btn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:#dfd3bc;cursor:pointer;transition:all .14s;flex-shrink:0}
.ico-btn:hover{border-color:var(--g2);background:#2a2317;color:var(--g)}
.ico-btn.on{border-color:var(--g);background:rgba(196,163,90,.18);color:var(--g)}
.ico-btn.boxed{border-color:var(--g2);background:#1b1710}
.ico-sep{width:1px;height:20px;background:#3a3122;margin:0 3px;flex-shrink:0}
.rte{border:1px solid var(--g2);background:#14110b;display:flex;flex-direction:column}
.rte.word-focus{position:fixed;inset:16px;z-index:1100;box-shadow:0 24px 80px rgba(0,0,0,.92);border-color:var(--g)}
.rtb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--g2);position:sticky;top:0;background:#1e1911;z-index:5}
.rtb-cheat{display:none;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:4px 10px;padding:8px 12px;background:#15120c;border-bottom:1px solid #352c1d;font:600 11px/1.4 monospace;color:var(--g)}
.rtb-cheat.open{display:grid}
.word-desk{background:#231e16;padding:clamp(14px,2.5vw,28px);max-height:68vh;overflow:auto;transition:background .2s}
.rte.word-focus .word-desk{flex:1;max-height:none;padding:32px 24px}
.word-desk.dark-paper{background:#110f0b}
.rtc{width:100%;max-width:960px;margin:0 auto;min-height:380px;padding:clamp(22px,3.2vw,44px) clamp(20px,3.5vw,52px);line-height:1.72;outline:none;font:400 16px/1.72 Bitter,Georgia,serif;background:#faf6ee;color:#1e1912;border:1px solid #d5c7ac;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background .2s,color .2s}
.word-desk.dark-paper .rtc{background:#1b1812;color:#f3ead8;border-color:#3d3321}
.rtc:empty::before{content:attr(data-ph);color:#8a7f6b}
.word-desk.dark-paper .rtc:empty::before{color:var(--mut)}
.rtc h2{font:700 1.32rem/1.3 Bitter,serif;margin:22px 0 10px;border-bottom:1px solid #d5c7ac;padding-bottom:4px;color:#1a140b}
.rtc h3{font:700 1.08rem/1.35 Bitter,serif;margin:16px 0 8px;color:#6c5222}
.rtc h4{font:700 1rem Bitter,serif;margin:14px 0 6px;color:#3d2f17}
.word-desk.dark-paper .rtc h2{color:var(--g);border-bottom-color:var(--g2)}
.word-desk.dark-paper .rtc h3{color:#e2c686}
.word-desk.dark-paper .rtc h4{color:#f3ead8}
.rtc p{margin:0 0 .9em}.rtc ul,.rtc ol{padding-left:1.5rem;margin:0 0 .9em}
.rtc blockquote{margin:.9em 0;padding:.5em 1.1em;border-left:4px solid #9a7b3e;font-style:italic;background:rgba(154,123,62,.09)}
.word-desk.dark-paper .rtc blockquote{border-left-color:var(--g);background:rgba(255,255,255,.04)}
.rtc a{color:#8a6520;text-decoration:underline dotted}.word-desk.dark-paper .rtc a{color:var(--g)}
.rtc img{display:block;max-width:100%;height:auto}.rtc figure{margin:1em 0;padding:4px;border:1px dashed transparent}.rtc figure.sel{border-color:#e04040}
.rtc figure.fr{float:right;width:42%;margin:.2em 0 .6em 1em}.rtc figure.fl{float:left;width:42%;margin:.2em 1em .6em 0}.rtc figure.fc{max-width:90%;margin:1em auto}.rtc figcaption{font-size:.85rem;color:#6e6351}
.word-desk.dark-paper .rtc figcaption{color:var(--mut)}

const MAP_W=8192,MAP_H=4864,S4=16;
const MAP_BOUNDS=()=>L.latLngBounds([-MAP_H/S4,0],[0,MAP_W/S4]);
const TILE_BOUNDS=()=>L.latLngBounds([-(MAP_H/S4)+0.01,0.01],[-0.01,(MAP_W/S4)-0.01]);
const Z5_BOUNDS=()=>L.latLngBounds([-159.8,256.2],[-64.2,351.8]);
const pctToLL=(x,y)=>[-(+y/100)*(MAP_H/S4),(+x/100)*(MAP_W/S4)];
const llToPct=ll=>({
  x:+Math.min(100,Math.max(0,(ll.lng/(MAP_W/S4))*100)).toFixed(2),
  y:+Math.min(100,Math.max(0,(-ll.lat/(MAP_H/S4))*100)).toFixed(2)
});
const MAP_PRESETS=[
  {id:"world",label:"Dunia",bounds:[[-298,10],[-6,502]]},
  {id:"islam",label:"Timur Tengah",bounds:[[-176,222],[-72,422]]},
  {id:"arabia",label:"Jazirah Arab",bounds:[[-148,266],[-90,326]]}
];

  if(kind==="selected") return L.divIcon({className:"adm-pin-icon",html:'<div class="adm-pin-active sel-crimson"></div>',iconSize:[18,18],iconAnchor:[9,9]});

function createAdminLeafletMap(stageEl,initialFocus){
  const canvas=el("div","adm-map-canvas"),hudZ=el("div","adm-map-hud-z","ZOOM —"),hudXY=el("div","adm-map-hud-xy","Kursor: —");
  stageEl.append(canvas,hudZ,hudXY);
  if(typeof L==="undefined"){
    hudZ.textContent="Leaflet gagal dimuat";
    return {map:null,destroy:()=>{}};
  }
  const map=L.map(canvas,{
    crs:L.CRS.Simple,
    minZoom:0.35,
    maxZoom:5.5,
    zoomSnap:0.15,
    zoomDelta:0.6,
    wheelPxPerZoomLevel:85,
    zoomControl:false,
    attributionControl:false,
    scrollWheelZoom:true,
    doubleClickZoom:false,
    maxBounds:MAP_BOUNDS().pad(0.1),
    maxBoundsViscosity:0.85
  });
  L.tileLayer("assets/tiles/{z}/{x}/{y}.webp",{
    tileSize:512,minZoom:0,maxNativeZoom:4,maxZoom:5.5,noWrap:true,bounds:TILE_BOUNDS(),keepBuffer:4
  }).addTo(map);
  L.tileLayer("assets/tiles/{z}/{x}/{y}.webp",{
    tileSize:512,minZoom:4.1,maxNativeZoom:5,maxZoom:5.5,noWrap:true,bounds:Z5_BOUNDS(),keepBuffer:2,zIndex:205
  }).addTo(map);
  const syncHud=()=>{
    const z=map.getZoom();
    hudZ.textContent=`ZOOM ${z.toFixed(1)}x`+(z>=4.1?" · HD REGIONAL":"");
  };
  map.on("zoom zoomend",syncHud);
  map.on("mousemove",e=>{
    const p=llToPct(e.latlng);
    hudXY.textContent=`Kursor: X ${p.x.toFixed(2)}% · Y ${p.y.toFixed(2)}%`;
  });
  map.on("mouseout",()=>{hudXY.textContent="Scroll / +/- untuk zoom · Klik atau seret pin"});
  const ro=new ResizeObserver(()=>{if(map&&canvas.isConnected)map.invalidateSize({animate:false})});
  ro.observe(stageEl);
  requestAnimationFrame(()=>{
    if(!canvas.isConnected)return;
    map.invalidateSize({animate:false});
    if(initialFocus&&initialFocus.x!=null&&initialFocus.y!=null){
      map.setView(pctToLL(initialFocus.x,initialFocus.y),initialFocus.zoom||3.6,{animate:false});
    }else{
      map.fitBounds(MAP_PRESETS[1].bounds,{animate:false});
    }
    syncHud();
  });
  return {
    map,
    destroy:()=>{ro.disconnect();try{map.remove()}catch(e){}}
  };
}

function renderAiPanel(L){
  L.replaceChildren();
  const sub=el("div","adm-subbar"),tb=el("div","tabs");
  Object.keys(SC).forEach(k=>{
    const b=el("button",k==tab?"on":"",SC[k].l);
    b.onclick=async()=>{tab=k;ed=null;await panel()};
    tb.append(b);
  });
  const aiBtn=el("button","on","✦ AI & Engine");
  aiBtn.onclick=()=>{tab="ai";ed=null;renderAiPanel(shell())};
  tb.append(aiBtn);
  sub.append(tb);
  L.append(sub);

  const box=el("div","ai-panel-box");
  
  const storedKey=(window.ALFA_CFG && window.ALFA_CFG.geminiKey)||localStorage.getItem("alfa_gemini_key")||"";
  const storedModel=(window.ALFA_CFG && window.ALFA_CFG.geminiModel)||localStorage.getItem("alfa_gemini_model")||"gemini-flash-lite-latest";

  const badge=el("div","ai-head-badge");
  const dot=el("span","ai-dot"+(storedKey?" live":""));
  const badgeTxt=el("span","",storedKey?"Google Gemini AI: Terhubung":"Google Gemini AI: Belum Terhubung");
  badge.append(dot,badgeTxt);

  const keyRow=el("div","ai-row");
  keyRow.append(el("label","","Gemini API Key (Tersimpan privat di peramban ini):"));
  const keyInput=document.createElement("input");
  keyInput.type="password";
  keyInput.placeholder="Masukkan API Key Gemini...";
  keyInput.value=storedKey;
  keyRow.append(keyInput);

  const modelRow=el("div","ai-row");
  modelRow.append(el("label","","Model AI:"));
  const modelSel=document.createElement("select");
  [["gemini-flash-lite-latest","Gemini Flash Lite (Rekomendasi Cepat & Ringan)"],
   ["gemini-3.5-flash-lite","Gemini 3.5 Flash Lite (Cepat & Stabil)"],
   ["gemini-3.8-flash","Gemini 3.8 Flash (Model Cerdas)"],
   ["gemini-flash-latest","Gemini Flash Latest (Standar)"]].forEach(([val,lb])=>{
    const opt=document.createElement("option");
    opt.value=val;opt.textContent=lb;
    if(val===storedModel) opt.selected=true;
    modelSel.append(opt);
  });
  modelRow.append(modelSel);

  const testRes=el("div","ai-test-res");

  const acts=el("div","ai-acts");
  const saveBtn=el("button","","Simpan Pengaturan");
  const testBtn=el("button","","Uji Koneksi AI");
  const clearBtn=el("button","","Hapus Kunci");

  saveBtn.onclick=()=>{
    const k=keyInput.value.trim();
    if(!k){toast("Kunci API tidak boleh kosong","warn");return}
    localStorage.setItem("alfa_gemini_key",k);
    localStorage.setItem("alfa_gemini_model",modelSel.value);
    if(window.ALFA_CFG) {
      window.ALFA_CFG.geminiKey=k;
      window.ALFA_CFG.geminiModel=modelSel.value;
    }
    dot.className="ai-dot live";
    badgeTxt.textContent="Google Gemini AI: Terhubung";
    toast("Pengaturan AI Gemini berhasil disimpan!");
  };

  testBtn.onclick=async()=>{
    const k=keyInput.value.trim();
    if(!k){toast("Masukkan kunci API terlebih dahulu","warn");return}
    testBtn.disabled=true;
    testBtn.textContent="Menguji...";
    testRes.style.display="block";
    testRes.textContent="Menghubungi endpoint Gemini API...";
    const modelsToTry=[modelSel.value,"gemini-flash-lite-latest","gemini-3.5-flash-lite","gemini-3.8-flash","gemini-flash-latest"].filter((v,i,a)=>a.indexOf(v)===i);
    let success=false;
    let lastErr="";
    for(const m of modelsToTry){
      try{
        const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(k),{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{parts:[{text:"Uji koneksi ensiklopedia ALFA History. Jawab ringkas."}]}]
          })
        });
        const data=await res.json();
        if(!res.ok){
          lastErr=data?.error?.message || ("HTTP "+res.status);
          continue;
        }
        const txt=data?.candidates?.[0]?.content?.parts?.[0]?.text;
        testRes.textContent="✓ BERHASIL (Model: "+m+")! Respons AI:\n\n"+(txt||"OK");
        toast("Koneksi ke Gemini AI Berhasil!");
        success=true;
        break;
      }catch(err){
        lastErr=err.message;
      }
    }
    if(!success){
      testRes.textContent="✕ GAGAL: "+(lastErr||"Tidak dapat terhubung ke endpoint Gemini.")+"\nPastikan GEMINI_API_KEY valid dan kuota API tersedia.";
      toast("Uji koneksi gagal.","err");
    }
    testBtn.disabled=false;
    testBtn.textContent="Uji Koneksi AI";
  };

  clearBtn.onclick=()=>{
    localStorage.removeItem("alfa_gemini_key");
    if(window.ALFA_CFG) delete window.ALFA_CFG.geminiKey;
    keyInput.value="";
    dot.className="ai-dot";
    badgeTxt.textContent="Google Gemini AI: Belum Terhubung";
    testRes.style.display="none";
    toast("Kunci AI dihapus dari peramban.");
  };

  acts.append(saveBtn,testBtn,clearBtn);
  const pubNote=el("p","m","Catatan: Kunci API ini dikonfigurasi di config.js untuk mendukung fitur Ringkasan Sejarah ALFA pada pencarian semantik.");
  box.append(badge,pubNote,keyRow,modelRow,acts,testRes);
  L.append(box);
}
