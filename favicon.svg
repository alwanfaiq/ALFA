<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --emblem-outer: #C4A35A;
      --emblem-inner: #D4AF37;
      --emblem-core: #14110B;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --emblem-outer: #18140E;
        --emblem-inner: #C4A35A;
        --emblem-core: #FAF6EE;
      }
    }
  </style>
  <!-- Outer Diamond Border -->
  <path d="M 32 4 L 60 32 L 32 60 L 4 32 Z" fill="var(--emblem-core)" stroke="var(--emblem-outer)" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Middle Diamond Accent -->
  <path d="M 32 12 L 52 32 L 32 52 L 12 32 Z" fill="var(--emblem-outer)" stroke="none"/>
  <!-- Inner Diamond Core -->
  <path d="M 32 20 L 44 32 L 32 44 L 20 32 Z" fill="var(--emblem-core)" stroke="none"/>
  <!-- Center Star Spark -->
  <path d="M 32 26 L 34.5 32 L 32 37.5 L 29.5 32 Z" fill="var(--emblem-inner)"/>
</svg>