<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .vajra-outer { stroke: #D4AF37; stroke-width: 4.5; fill: #18140E; }
    .vajra-inner { fill: #D4AF37; }
    .vajra-center { fill: #18140E; }
    @media (prefers-color-scheme: light) {
      .vajra-outer { stroke: #1A1A1A; stroke-width: 4.5; fill: #F4EBD9; }
      .vajra-inner { fill: #1A1A1A; }
      .vajra-center { fill: #C4A35A; }
    }
  </style>
  <g transform="rotate(45 32 32)">
    <rect class="vajra-outer" x="12" y="12" width="40" height="40" rx="4" />
    <rect class="vajra-inner" x="20" y="20" width="24" height="24" rx="2" />
    <rect class="vajra-center" x="27" y="27" width="10" height="10" rx="1" />
  </g>
</svg>
